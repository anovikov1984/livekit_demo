services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

  app:
    build:
      context: ./token-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      LIVEKIT_WS_URL: "wss://${DOMAIN}"
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
